<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" role="img" aria-labelledby="title description">
  <title id="title">AWS Cloud Resume architecture</title>
  <desc id="description">A light-mode architecture diagram showing CloudFront and private S3 for the resume site, plus a Lambda Function URL, Python Lambda, and DynamoDB for the visitor counter. GitHub Actions deploys the site and Terraform provisions the stack.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#31524d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#315f58"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#cf6b43"/>
    </marker>
    <style>
      .page-title { font: 700 40px "Trebuchet MS", sans-serif; fill: #173f3b; }
      .page-subtitle { font: 500 19px "Trebuchet MS", sans-serif; fill: #5f7470; }
      .cloud-title { font: 700 28px "Trebuchet MS", sans-serif; fill: #173f3b; }
      .section-label { font: 700 16px "Trebuchet MS", sans-serif; letter-spacing: 2px; fill: #627773; }
      .node-title { font: 700 22px "Trebuchet MS", sans-serif; fill: #173f3b; }
      .node-copy { font: 500 16px "Trebuchet MS", sans-serif; fill: #5f7470; }
      .icon-text { font: 700 20px "Trebuchet MS", sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: middle; }
      .edge-label { font: 600 15px "Trebuchet MS", sans-serif; fill: #47645f; text-anchor: middle; }
      .edge-pill { fill: #ffffff; stroke: #dce5e2; stroke-width: 1; }
      .flow { fill: none; stroke: #315f58; stroke-width: 3; marker-end: url(#arrow); }
      .provision { fill: none; stroke: #cf6b43; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1200" height="960" rx="28" fill="#fbfcfa"/>
  <circle cx="1110" cy="65" r="165" fill="#f1c36a" opacity="0.16"/>
  <circle cx="60" cy="900" r="190" fill="#e69a79" opacity="0.12"/>

  <text x="50" y="60" class="page-title">AWS Cloud Resume Architecture</text>
  <text x="50" y="92" class="page-subtitle">Static delivery, a serverless visitor counter, infrastructure as code, and automated deployment</text>

  <!-- AWS boundary -->
  <rect x="235" y="130" width="915" height="580" rx="26" fill="#ffffff" stroke="#91aaa5" stroke-width="3" filter="url(#shadow)"/>
  <rect x="266" y="156" width="8" height="34" rx="4" fill="#f19a38"/>
  <text x="292" y="183" class="cloud-title">AWS Cloud</text>
  <text x="1020" y="179" class="node-copy">eu-west-2</text>

  <text x="275" y="235" class="section-label">RESUME DELIVERY</text>
  <line x1="275" y1="251" x2="1110" y2="251" stroke="#dce5e2" stroke-width="2"/>

  <text x="275" y="446" class="section-label">VISITOR COUNTER</text>
  <line x1="275" y1="462" x2="1110" y2="462" stroke="#dce5e2" stroke-width="2"/>

  <!-- Visitor -->
  <g filter="url(#shadow)">
    <rect x="30" y="276" width="170" height="112" rx="20" fill="#ffffff" stroke="#d5e0dd" stroke-width="2"/>
    <circle cx="72" cy="320" r="24" fill="#315f58"/>
    <circle cx="72" cy="312" r="8" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M55 337c6-12 28-12 34 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="111" y="318" class="node-title">Visitor</text>
    <text x="111" y="344" class="node-copy">Browser</text>
  </g>

  <!-- CloudFront -->
  <g filter="url(#shadow)">
    <rect x="300" y="283" width="300" height="136" rx="21" fill="#f5efff" stroke="#d9c8f3" stroke-width="2"/>
    <rect x="325" y="322" width="58" height="58" rx="15" fill="#8c4fff"/>
    <text x="354" y="352" class="icon-text">CF</text>
    <text x="403" y="336" class="node-title">CloudFront</text>
    <text x="403" y="363" class="node-copy">HTTPS and CDN</text>
    <text x="403" y="388" class="node-copy">Security headers</text>
  </g>

  <!-- S3 -->
  <g filter="url(#shadow)">
    <rect x="760" y="283" width="300" height="136" rx="21" fill="#eef9ed" stroke="#c6e3c3" stroke-width="2"/>
    <rect x="785" y="322" width="58" height="58" rx="15" fill="#4aa646"/>
    <text x="814" y="352" class="icon-text">S3</text>
    <text x="863" y="336" class="node-title">Amazon S3</text>
    <text x="863" y="363" class="node-copy">Private static origin</text>
    <text x="863" y="388" class="node-copy">HTML, CSS and JavaScript</text>
  </g>

  <!-- Function URL -->
  <g filter="url(#shadow)">
    <rect x="275" y="500" width="245" height="136" rx="21" fill="#fff3ee" stroke="#f0c9b9" stroke-width="2"/>
    <rect x="297" y="532" width="58" height="58" rx="15" fill="#d96d4b"/>
    <text x="326" y="562" class="icon-text" style="font-size:16px">URL</text>
    <text x="375" y="548" class="node-title">Function URL</text>
    <text x="375" y="577" class="node-copy">Public GET API</text>
    <text x="297" y="614" class="node-copy">CORS-enabled endpoint</text>
  </g>

  <!-- Lambda -->
  <g filter="url(#shadow)">
    <rect x="575" y="500" width="245" height="136" rx="21" fill="#fff7e7" stroke="#f2d89e" stroke-width="2"/>
    <rect x="597" y="532" width="58" height="58" rx="15" fill="#ed8b00"/>
    <text x="626" y="562" class="icon-text">&#955;</text>
    <text x="675" y="548" class="node-title">AWS Lambda</text>
    <text x="675" y="577" class="node-copy">Python 3.12</text>
    <text x="597" y="614" class="node-copy">Atomic counter handler</text>
  </g>

  <!-- DynamoDB -->
  <g filter="url(#shadow)">
    <rect x="875" y="500" width="245" height="136" rx="21" fill="#eef2ff" stroke="#c9d3f4" stroke-width="2"/>
    <rect x="897" y="532" width="58" height="58" rx="15" fill="#4265cf"/>
    <text x="926" y="562" class="icon-text" style="font-size:16px">DB</text>
    <text x="975" y="548" class="node-title">DynamoDB</text>
    <text x="975" y="577" class="node-copy">On-demand</text>
    <text x="897" y="614" class="node-copy">Encrypted counter table</text>
  </g>

  <!-- Runtime arrows -->
  <path d="M200 315 C235 315 258 351 300 351" class="flow"/>
  <rect x="217" y="282" width="64" height="26" rx="8" class="edge-pill"/>
  <text x="249" y="301" class="edge-label">HTTPS</text>

  <path d="M600 351 H760" class="flow"/>
  <rect x="622" y="313" width="116" height="26" rx="8" class="edge-pill"/>
  <text x="680" y="332" class="edge-label">Private origin</text>

  <path d="M115 388 V675 H397 V636" class="flow"/>
  <rect x="211" y="637" width="90" height="26" rx="8" class="edge-pill"/>
  <text x="256" y="656" class="edge-label">HTTPS GET</text>

  <path d="M520 568 H575" class="flow"/>
  <rect x="524" y="528" width="48" height="26" rx="8" class="edge-pill"/>
  <text x="548" y="547" class="edge-label">GET</text>

  <path d="M820 568 H875" class="flow"/>
  <rect x="824" y="528" width="48" height="26" rx="8" class="edge-pill"/>
  <text x="848" y="547" class="edge-label">ADD</text>

  <!-- External automation row -->
  <text x="30" y="762" class="section-label">DELIVERY AND PROVISIONING</text>
  <line x1="30" y1="778" x2="1150" y2="778" stroke="#dce5e2" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="30" y="810" width="220" height="105" rx="20" fill="#ffffff" stroke="#d5e0dd" stroke-width="2"/>
    <circle cx="72" cy="851" r="24" fill="#24292f"/>
    <text x="72" y="852" class="icon-text" style="font-size:13px">GH</text>
    <text x="111" y="848" class="node-title">GitHub</text>
    <text x="111" y="875" class="node-copy">Source repository</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="810" width="300" height="105" rx="20" fill="#f3f5f5" stroke="#cfdad7" stroke-width="2"/>
    <circle cx="410" cy="851" r="24" fill="#24292f"/>
    <text x="410" y="852" class="icon-text" style="font-size:13px">GA</text>
    <text x="450" y="848" class="node-title">GitHub Actions</text>
    <text x="450" y="875" class="node-copy">Validate and deploy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="825" y="810" width="260" height="105" rx="20" fill="#f6f0fc" stroke="#dbcbea" stroke-width="2"/>
    <rect x="848" y="829" width="48" height="48" rx="13" fill="#7b42bc"/>
    <text x="872" y="854" class="icon-text" style="font-size:14px">TF</text>
    <text x="919" y="848" class="node-title">Terraform</text>
    <text x="919" y="875" class="node-copy">Provisions AWS stack</text>
  </g>

  <!-- Automation arrows -->
  <path d="M250 862 H365" class="flow"/>
  <rect x="281" y="822" width="54" height="26" rx="8" class="edge-pill"/>
  <text x="308" y="841" class="edge-label">Push</text>

  <path d="M515 810 V745 H910 V419" class="flow"/>
  <rect x="594" y="704" width="220" height="26" rx="8" class="edge-pill"/>
  <text x="704" y="723" class="edge-label">Sync site and invalidate cache</text>

  <path d="M955 810 V680" class="provision"/>
  <rect x="970" y="724" width="166" height="26" rx="8" class="edge-pill"/>
  <text x="1053" y="743" class="edge-label">Infrastructure as code</text>
</svg>
